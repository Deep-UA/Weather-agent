name: PR checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The zero-token tier: no secrets, no network in tests, must stay under 5 minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to release commits: setup-uv has no floating major tags, and SHAs can't be moved.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -m "not llm and not live and not smoke"
